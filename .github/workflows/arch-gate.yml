name: Architecture Quality Gate

# Runs the deterministic arch-gate scanner (the back-end half of the quality sandwich,
# ADR-0002) on every push (any branch) and every PR into main. It enforces the judge-arch
# rules against the ADR-0003 layer structure. Zero dependencies — just Node — so no install step.

on:
  # Week 5: run on EVERY push, not just main — so `push:` has no branch filter.
  push:
  pull_request:
    branches: [main]

concurrency:
  group: arch-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-gate:
    name: Verify architectural integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so changed files can be diffed against the base

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run arch-gate
        run: node scripts/arch-gate.mjs --changed --base "origin/${{ github.base_ref || 'main' }}"

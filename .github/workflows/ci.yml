name: CI

# The app-level quality gate for the studio/ Next.js project (Build Plan NFR-O1 / Step 6):
# lint, format, types, unit tests, build, and dependency + secret scanning. Runs on every push
# (any branch) and on every PR into main, alongside the Architecture Quality Gate
# (arch-gate.yml). See ADR-0006 (supersedes ADR-0002).

on:
  # Week 5: CI must run on EVERY push, not just main — so `push:` has no branch filter.
  push:
  pull_request:
    branches: [main]

# Only keep the latest run per branch/PR; cancel superseded runs so pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-checks:
    name: App checks (studio)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      # Security — database permissions (static), ADR-0035 / PenTest F-17 / SR-23.
      # CI has no database (ADR-0016), so these tests replay the migration files as text and fail if
      # a later migration reopens a fixed hole. They run before the full suite so a permission
      # regression fails fast under its own name. The real-database proof is the hand-run
      # studio/supabase/checks/*.sql scripts (ADR-0035 point 2). If a file filter matches nothing,
      # Vitest exits non-zero, so a renamed test can't silently drop out of this gate.
      - name: Security — database permissions (static) · review decided once (ADR-0028; F-01, F-21)
        run: npm run test:run -- review-integrity

      - name: Security — database permissions (static) · AI request counter (ADR-0030; F-02)
        run: npm run test:run -- rate-limit-integrity

      - name: Security — database permissions (static) · leader-only policy changes (ADR-0031; F-03, F-18)
        run: npm run test:run -- policy-integrity

      - name: Security — database permissions (static) · audit log append-only (ADR-0026)
        run: npm run test:run -- audit-append-only

      - name: Security — database permissions (static) · no logged-out access (ADR-0029)
        run: npm run test:run -- no-anon-access

      - name: Security — database permissions (static) · sign-up limits (ADR-0034; F-07)
        run: npm run test:run -- signup-integrity

      - name: Unit tests (Vitest)
        run: npm run test:run

      - name: Build (next build)
        run: npm run build

      - name: Dependency scan — production (block on high+)
        # What ships to users is held to a strict bar; the postcss override keeps this clean.
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency scan — all packages incl. dev tooling (block on high+)
        # ADR-0038 / PenTest F-16 / SR-22: dev tooling runs on our machines and in CI, so a high or
        # critical advisory anywhere blocks the merge. Moderate/low are printed but don't block.
        # No fixed version yet? Record an exception in an ADR and use a scoped `overrides` entry —
        # never `|| true` (ADR-0038 point 4).
        run: npm audit --audit-level=high

  bdd-acceptance:
    # The third Week-5 named check (ADR-0016): the Week-2 BDD scenarios traced to tests, run as
    # named per-dimension steps for traceability. The full suite still runs in app-checks above;
    # these steps are a requirement-to-check view, not a replacement. Mapping + coverage labels
    # (covered / partial / gap) live in docs/reference/week-5-bdd-traceability.md.
    name: BDD acceptance (Release 1a)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: BDD — Policy seed (F1.1)
        run: npm run test:run -- policy-seed policy-generator

      - name: BDD — Active-policy inheritance (F1.3)
        run: npm run test:run -- pipeline-policy-context

      - name: BDD — Co-Pilot safety (F4.1 / F4.2 / F4.4, F5.1 slice)
        run: npm run test:run -- copilot guardrails standards

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan new commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

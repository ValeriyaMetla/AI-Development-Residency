name: CI

# The app-level quality gate for the studio/ Next.js project (Build Plan NFR-O1 / Step 6):
# lint, format, types, unit tests, build, and dependency + secret scanning. Runs on every PR
# and on push to main, alongside the Architecture Quality Gate (arch-gate.yml). See ADR-0006
# (supersedes ADR-0002).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  app-checks:
    name: App checks (studio)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm run test:run

      - name: Build (next build)
        run: npm run build

      - name: Dependency scan — production (block on high+)
        # What ships to users is held to a strict bar; the postcss override keeps this clean.
        run: npm audit --omit=dev --audit-level=high

      - name: Dependency report — dev tooling (non-blocking)
        # Dev-only advisories (test runner, bundler) never reach runtime; Dependabot tracks them.
        run: npm audit || true

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan new commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
